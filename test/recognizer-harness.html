<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <title>HOF screenshot recognizer fixture test</title>
    </head>
    <body>
        <pre id="result">running</pre>
        <script src="../js/hof-screenshot.js"></script>
        <script>
            const fixtures = [
                "full-inventory-and-combo.png",
                "combo-panel-multi-items.png",
                "inventory-6x4-plus-minus.png",
                "inventory-with-reserve-bag.png",
            ];
            const expected = {
                "full-inventory-and-combo.png": {
                    inventoryDetected: true,
                    comboDetected: true,
                    rows: 4,
                    states: { occupied: 1, empty: 22, absent: 1 },
                    items: ["0,0:파이어 볼트"],
                    combos: ["잉걸불"],
                },
                "combo-panel-multi-items.png": {
                    inventoryDetected: false,
                    comboDetected: true,
                    rows: 0,
                    states: {},
                    items: [],
                    combos: ["교섭", "잉걸불", "견고", "그림자"],
                },
                "inventory-6x4-plus-minus.png": {
                    inventoryDetected: true,
                    comboDetected: false,
                    rows: 4,
                    states: { occupied: 10, empty: 7, minus: 4, plus: 2, absent: 1 },
                    items: [
                        "0,0:파이어 볼트",
                        "0,3:가시 부적",
                        "0,4:크리톤의 인장",
                        "1,2:황금 단풍잎",
                        "1,5:경쟁",
                        "2,1:부서진 사파이어",
                        "2,3:행운의 메달",
                        "2,4:명예",
                        "3,1:응집",
                        "3,3:열망",
                    ],
                    combos: [],
                },
                "inventory-with-reserve-bag.png": {
                    inventoryDetected: true,
                    comboDetected: false,
                    rows: 4,
                    states: { occupied: 20, minus: 3, absent: 1 },
                    items: [
                        "0,0:반격의 팔찌",
                        "0,1:번개 부메랑",
                        "0,2:출구",
                        "0,3:간이 계약서",
                        "0,4:신갈나무 숯",
                        "0,5:황금 단풍잎",
                        "1,0:전격 차크람",
                        "1,1:구름 병",
                        "1,2:행운의 메달",
                        "1,3:출구",
                        "1,4:화합",
                        "1,5:에어 볼트",
                        "2,0:명석함의 부적",
                        "2,1:루비 브로치",
                        "2,2:집결",
                        "2,3:화난 감자",
                        "2,4:뇌운추적 나침반",
                        "2,5:재주의 부적",
                        "3,1:명예",
                        "3,2:응집",
                    ],
                    combos: [],
                },
            };

            function parseCsv(text) {
                const rows = [];
                let row = [];
                let field = "";
                let quoted = false;
                text = text.replace(/^\uFEFF/, "");
                for (let i = 0; i < text.length; i++) {
                    const char = text[i];
                    const next = text[i + 1];
                    if (char === '"') {
                        if (quoted && next === '"') {
                            field += '"';
                            i++;
                        } else {
                            quoted = !quoted;
                        }
                    } else if (char === "," && !quoted) {
                        row.push(field);
                        field = "";
                    } else if ((char === "\n" || char === "\r") && !quoted) {
                        if (char === "\r" && next === "\n") i++;
                        row.push(field);
                        if (row.some((value) => value.trim())) rows.push(row);
                        row = [];
                        field = "";
                    } else {
                        field += char;
                    }
                }
                row.push(field);
                if (row.some((value) => value.trim())) rows.push(row);
                const headers = rows.shift().map((value) => value.trim());
                return rows.map((values) => Object.fromEntries(headers.map((header, index) => [header, (values[index] || "").trim()])));
            }

            async function loadPickerKind(kind, csv, folder) {
                const rows = parseCsv(await fetch(`../data/${csv}`).then((response) => response.text()));
                return rows.filter((row) => row.file).map((row) => ({
                    kind,
                    file: row.file,
                    nameKo: row.name_ko || row.name_en || row.file,
                    icon: `../assets/${folder}/${encodeURIComponent(row.file)}.png`,
                }));
            }

            const pickerDataPromise = Promise.all([
                loadPickerKind("artifact", "artifact_index.csv", "artifacts"),
                loadPickerKind("tablet", "tablet_index.csv", "tablets"),
                loadPickerKind("combo", "category_index.csv", "combos"),
            ]).then(([artifact, tablet, combo]) => ({ artifact, tablet, combo }));

            function loadFixture(name) {
                return new Promise((resolve, reject) => {
                    const image = new Image();
                    image.onload = () => resolve(image);
                    image.onerror = reject;
                    image.src = `./fixtures/screenshots/${name}`;
                });
            }

            Promise.all(
                fixtures.map(async (name) => {
                    const image = await loadFixture(name);
                    const pickerData = await pickerDataPromise;
                    const result = await window.HofScreenshotRecognizer.recognize({
                        image,
                        pickerData,
                    });
                    const actual = {
                        inventoryDetected: result.inventoryDetected,
                        comboDetected: result.comboDetected,
                        rows: result.rows,
                        states: result.inventory.reduce((counts, slot) => {
                            counts[slot.state] = (counts[slot.state] || 0) + 1;
                            return counts;
                        }, {}),
                        items: result.inventory.filter((slot) => slot.item).map((slot) => `${slot.row},${slot.col}:${slot.item.nameKo}`),
                        combos: result.combos.map((combo) => combo.nameKo),
                    };
                    return {
                        name,
                        passed: JSON.stringify(actual) === JSON.stringify(expected[name]),
                        actual,
                    };
                }),
            )
                .then((results) => {
                    const passed = results.filter((result) => result.passed).length;
                    document.getElementById("result").textContent = JSON.stringify({ passed, total: results.length, results }, null, 2);
                    document.body.dataset.done = passed === results.length ? "true" : "false";
                })
                .catch((error) => {
                    document.getElementById("result").textContent = String(error.stack || error);
                    document.body.dataset.done = "error";
                });
        </script>
    </body>
</html>
